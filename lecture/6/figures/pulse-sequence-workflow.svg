<svg xmlns="http://www.w3.org/2000/svg" viewBox="55 103 1170 537" role="img"
     aria-label="Pulse sequence design feeds acquisition and simulation. Both paths feed reconstruction.">
  <defs>
    <marker id="acquisition-arrow" viewBox="0 0 12 10" refX="12" refY="5" markerWidth="22"
            markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 5L0 10Z" fill="#555555"/>
    </marker>
    <marker id="simulation-arrow" viewBox="0 0 12 10" refX="12" refY="5" markerWidth="24"
            markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L12 5L0 10Z" fill="#a2bff0"/>
    </marker>
  </defs>
  <g fill="#eeeeee" stroke="#555555" stroke-width="1.5">
    <rect x="80" y="250" width="300" height="110"/>
    <rect x="490" y="250" width="300" height="110"/>
    <rect x="490" y="380" width="300" height="110" stroke="#a2bff0"/>
    <rect x="900" y="250" width="300" height="110" stroke="#e00000" stroke-width="5"/>
  </g>
  <g fill="none" stroke="#555555" stroke-width="4" marker-end="url(#acquisition-arrow)">
    <path d="M380 305H490"/>
    <path d="M790 305H900"/>
  </g>
  <g fill="none" stroke="#a2bff0" stroke-width="5" marker-end="url(#simulation-arrow)">
    <path d="M420 307V435H490"/>
    <path d="M790 435H830V307"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="26" fill="#343a40" text-anchor="middle" dominant-baseline="central">
    <text x="230" y="305">Pulse sequence design</text>
    <text x="640" y="305">Acquisition</text>
    <text x="640" y="435">Simulation</text>
    <text x="1050" y="305" fill="#e00000">Reconstruction</text>
  </g>
  <image x="597" y="128" width="86" height="94" href="data:image/webp;base64,"/>
  <image x="583" y="520" width="114" height="100" href="data:image/webp;base64,"/>
</svg>
