name: Diagnose standalone Windows FFTW threading

on:
  pull_request:
    paths:
      - .github/workflows/issue14-fftw-windows.yml
      - diagnostics/fftw-windows/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fftw:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [plain, malt, pluto]
        provider: [fftw, mkl]
        threads: [8, 20]
        exclude:
          - mode: pluto
            provider: fftw
          - provider: fftw
            threads: 20
    env:
      JULIA_NUM_THREADS: ${{ matrix.threads }}
      FFT_PROVIDER: ${{ matrix.provider }}
      JULIA_PKG_PRECOMPILE_AUTO: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10.13'
          arch: x64
      - name: Install the diagnostic dependencies
        run: julia --startup-file=no --project=diagnostics/fftw-windows -e 'using Pkg; Pkg.instantiate()'
      - name: Run directly
        if: matrix.mode == 'plain'
        run: julia --startup-file=no --project=diagnostics/fftw-windows diagnostics/fftw-windows/reproduce.jl $env:FFT_PROVIDER
      - name: Run in a Malt worker
        if: matrix.mode == 'malt'
        run: >-
          julia --startup-file=no --project=diagnostics/fftw-windows -e
          'using Malt; root=dirname(Base.active_project()); script=abspath("diagnostics/fftw-windows/reproduce.jl");
          worker=Malt.Worker(exeflags=["--threads=" * ENV["JULIA_NUM_THREADS"], "--project=$root"]);
          try Malt.remote_eval_fetch(worker, :(push!(ARGS, ENV["FFT_PROVIDER"]); include($script))); finally Malt.stop(worker); end'
      - name: Run in Pluto's isolated notebook environment
        if: matrix.mode == 'pluto'
        run: julia --startup-file=no --project=diagnostics/fftw-windows diagnostics/fftw-windows/pluto.jl
